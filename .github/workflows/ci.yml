name: Build & Push

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  IMAGE_TAG: php-8.3.2-composer-2.7.2

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ["self-hosted", "linux", "x64", "ubuntu-latest"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Build Docker image
        run: |
          docker build -f docker/php-composer/Dockerfile -t ${{ secrets.ECR_REPO }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.ECR_REPO }}:${{ env.IMAGE_TAG }}
          
